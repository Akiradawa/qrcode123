<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Review Demo</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f3f4;
    color:#222;
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
}

.card{
    background:white;
    padding:22px;
    border-radius:18px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
    margin-bottom:20px;
}

h1{
    margin:0 0 8px;
    text-align:center;
    font-size:27px;
}

.demo{
    text-align:center;
    background:#fff3cd;
    color:#856404;
    padding:10px;
    border-radius:10px;
    font-weight:bold;
    font-size:13px;
    margin-bottom:20px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:20px;
}

#reader{
    width:100%;
    overflow:hidden;
    border-radius:14px;
}

.status{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#f5f5f5;
    text-align:center;
    font-size:14px;
}

button{
    width:100%;
    border:0;
    padding:14px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    margin-top:10px;
}

.primary{
    background:#1a73e8;
    color:white;
}

.secondary{
    background:#e9ecef;
    color:#222;
}

input,
textarea{
    width:100%;
    padding:13px;
    margin-top:7px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:15px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

label{
    font-weight:bold;
    font-size:14px;
}

.stars{
    display:flex;
    justify-content:center;
    gap:5px;
    margin:15px 0;
}

.star{
    font-size:35px;
    cursor:pointer;
    color:#ccc;
}

.star.active{
    color:#ffc107;
}

.review{
    border:1px solid #ddd;
    padding:14px;
    border-radius:12px;
    margin-top:12px;
}

.review strong{
    display:block;
    margin-bottom:5px;
}

.review-stars{
    color:#f5a900;
}

.hidden{
    display:none;
}

.count{
    text-align:center;
    font-size:22px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>📱 QR Review Demo</h1>

        <div class="demo">
            EDUCATIONAL DEMO — TEST REVIEWS ONLY
        </div>

        <div class="subtitle">
            Scan a QR code to start the demonstration.
        </div>

        <div id="reader"></div>

        <div class="status" id="status">
            Point your camera at a QR code.
        </div>

        <button class="secondary" onclick="startScanner()">
            🔄 Start Scanner
        </button>

    </div>


    <!-- TEST REVIEW FORM -->

    <div class="card hidden" id="reviewSection">

        <h2>Test Review Form</h2>

        <label>Test User / Email</label>

        <input
            type="email"
            id="email"
            placeholder="example@test.com"
        >

        <label>Your Rating</label>

        <div class="stars">

            <span class="star" data-rating="1">★</span>
            <span class="star" data-rating="2">★</span>
            <span class="star" data-rating="3">★</span>
            <span class="star" data-rating="4">★</span>
            <span class="star" data-rating="5">★</span>

        </div>

        <label>Review</label>

        <textarea
            id="reviewText"
            placeholder="Write a test review..."
        ></textarea>

        <button class="primary" onclick="submitReview()">
            Submit Test Review
        </button>

        <button class="secondary" onclick="clearForm()">
            Clear
        </button>

    </div>


    <!-- DASHBOARD -->

    <div class="card">

        <h2>📊 Demo Dashboard</h2>

        <div class="count">
            <span id="reviewCount">0</span>
            Test Reviews
        </div>

        <div id="reviews"></div>

        <button class="secondary" onclick="clearAllReviews()">
            Delete All Test Reviews
        </button>

    </div>

</div>


<script>

let scanner = null;
let selectedRating = 0;


// ==============================
// QR SCANNER
// ==============================

function startScanner(){

    if(scanner){
        scanner.clear().catch(function(){});
    }

    scanner = new Html5Qrcode("reader");

    scanner.start(

        {
            facingMode:"environment"
        },

        {
            fps:10,
            qrbox:{
                width:250,
                height:250
            }
        },

        function(decodedText){

            document.getElementById("status").innerText =
                "QR code scanned successfully.";

            // Stop scanner
            scanner.clear().catch(function(){});

            // Show test form
            document
                .getElementById("reviewSection")
                .classList.remove("hidden");

            /*
             IMPORTANT:

             The scanned URL is intentionally NOT submitted
             to Google or another review service.

             It is only displayed as part of this educational
             QR-scanning demonstration.
            */

            console.log("Scanned QR:", decodedText);

        },

        function(errorMessage){

            // Scanner is still looking.
        }

    ).catch(function(error){

        document.getElementById("status").innerText =
            "Camera could not be opened. Allow camera permission and use HTTPS.";

        console.log(error);

    });

}


// ==============================
// STAR RATING
// ==============================

const stars = document.querySelectorAll(".star");

stars.forEach(function(star){

    star.addEventListener("click",function(){

        selectedRating =
            Number(this.dataset.rating);

        stars.forEach(function(s){

            if(
                Number(s.dataset.rating)
                <= selectedRating
            ){

                s.classList.add("active");

            }else{

                s.classList.remove("active");

            }

        });

    });

});


// ==============================
// SUBMIT TEST REVIEW
// ==============================

function submitReview(){

    const email =
        document.getElementById("email").value.trim();

    const text =
        document.getElementById("reviewText").value.trim();


    if(!email){

        alert("Enter a test email.");

        return;
    }


    if(selectedRating === 0){

        alert("Please select a rating.");

        return;
    }


    if(!text){

        alert("Write a test review.");

        return;
    }


    const review = {

        email:email,

        rating:selectedRating,

        text:text,

        date:new Date().toLocaleString()

    };


    let reviews =
        JSON.parse(
            localStorage.getItem("demoReviews")
        ) || [];


    reviews.push(review);


    localStorage.setItem(
        "demoReviews",
        JSON.stringify(reviews)
    );


    alert("Test review saved locally.");


    clearForm();

    loadReviews();

}


// ==============================
// CLEAR FORM
// ==============================

function clearForm(){

    document.getElementById("email").value = "";

    document.getElementById("reviewText").value = "";

    selectedRating = 0;

    stars.forEach(function(star){

        star.classList.remove("active");

    });

}


// ==============================
// LOAD REVIEWS
// ==============================

function loadReviews(){

    const reviews =
        JSON.parse(
            localStorage.getItem("demoReviews")
        ) || [];


    document.getElementById("reviewCount").innerText =
        reviews.length;


    const container =
        document.getElementById("reviews");


    container.innerHTML = "";


    reviews.forEach(function(review){

        const div =
            document.createElement("div");

        div.className = "review";


        let starHTML = "";

        for(let i = 1; i <= 5; i++){

            starHTML +=
                i <= review.rating
                ? "★"
                : "☆";

        }


        div.innerHTML = `

            <strong>${escapeHTML(review.email)}</strong>

            <div class="review-stars">
                ${starHTML}
            </div>

            <p>
                ${escapeHTML(review.text)}
            </p>

            <small>
                ${escapeHTML(review.date)}
            </small>

        `;


        container.appendChild(div);

    });

}


// ==============================
// DELETE ALL
// ==============================

function clearAllReviews(){

    if(
        confirm("Delete all test reviews?")
    ){

        localStorage.removeItem(
            "demoReviews"
        );

        loadReviews();

    }

}


// ==============================
// SECURITY
// ==============================

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


// Load saved demo data
loadReviews();

</script>

</body>
</html>
