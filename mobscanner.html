<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>3974 - Dawa Dawa | QR Review Scanner</title>

<style>

/* =========================================================
   GENERAL
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f3f4;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:15px;
}


/* =========================================================
   MAIN CARD
========================================================= */

.container{
    width:100%;
    max-width:500px;
    background:#ffffff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 5px 25px rgba(0,0,0,0.15);
}


/* =========================================================
   HEADER
========================================================= */

.header{
    padding:25px 22px 22px;
    background:#ffffff;
    border-top:9px solid #673ab7;
    border-bottom:1px solid #eeeeee;
    text-align:center;
}

.header h1{
    margin:0 0 8px;
    font-size:25px;
    font-weight:600;
    color:#202124;
}

.header p{
    margin:0;
    font-size:14px;
    line-height:1.5;
    color:#5f6368;
}


/* =========================================================
   CONTENT
========================================================= */

.content{
    padding:22px;
}


/* =========================================================
   LABEL
========================================================= */

label{
    display:block;
    margin-bottom:8px;
    font-size:15px;
    font-weight:bold;
    color:#202124;
}


/* =========================================================
   DEMO EMAIL
========================================================= */

.email{
    width:100%;
    height:50px;
    padding:0 14px;
    margin-bottom:22px;

    border:1px solid #dadce0;
    border-radius:7px;

    background:#ffffff;

    font-size:16px;
    color:#202124;

    outline:none;
}

.email:focus{
    border-color:#673ab7;
}


/* =========================================================
   CAMERA
========================================================= */

.camera-wrapper{
    width:100%;
    background:#000000;
    border-radius:12px;
    overflow:hidden;
    position:relative;
}

#video{
    display:block;
    width:100%;
    height:auto;
    min-height:300px;
    max-height:520px;
    object-fit:cover;
    background:#000000;
}


/* =========================================================
   SCAN FRAME
========================================================= */

.scan-frame{
    position:absolute;

    width:65vw;
    max-width:280px;

    height:65vw;
    max-height:280px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border:3px solid #ffffff;
    border-radius:15px;

    box-shadow:
        0 0 0 9999px rgba(0,0,0,0.30);

    pointer-events:none;
}


/* =========================================================
   SCAN CORNERS
========================================================= */

.scan-frame .corner{
    position:absolute;
    width:38px;
    height:38px;
}

.corner.top-left{
    top:-3px;
    left:-3px;
    border-top:5px solid #673ab7;
    border-left:5px solid #673ab7;
}

.corner.top-right{
    top:-3px;
    right:-3px;
    border-top:5px solid #673ab7;
    border-right:5px solid #673ab7;
}

.corner.bottom-left{
    bottom:-3px;
    left:-3px;
    border-bottom:5px solid #673ab7;
    border-left:5px solid #673ab7;
}

.corner.bottom-right{
    bottom:-3px;
    right:-3px;
    border-bottom:5px solid #673ab7;
    border-right:5px solid #673ab7;
}


/* =========================================================
   SCANNING LINE
========================================================= */

.scan-line{
    position:absolute;
    left:8%;
    width:84%;
    height:3px;
    background:#673ab7;

    top:10%;

    animation:scanLine 2s linear infinite;
}

@keyframes scanLine{

    0%{
        top:10%;
    }

    50%{
        top:88%;
    }

    100%{
        top:10%;
    }

}


/* =========================================================
   BUTTON
========================================================= */

button{
    width:100%;
    height:52px;

    margin-top:18px;

    border:none;
    border-radius:7px;

    background:#673ab7;
    color:#ffffff;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;
}

button:active{
    transform:scale(0.99);
}

button.stop{
    background:#d93025;
}

button:disabled{
    opacity:0.55;
    cursor:not-allowed;
}


/* =========================================================
   STATUS
========================================================= */

.status{
    margin-top:15px;

    padding:13px;

    background:#f8f5ff;

    border-radius:7px;

    text-align:center;

    font-size:14px;

    line-height:1.5;

    color:#5f6368;
}


/* =========================================================
   RESULT
========================================================= */

.result-title{
    margin-top:25px;
    margin-bottom:8px;

    font-size:15px;
    font-weight:bold;

    color:#202124;
}

.result{
    width:100%;
    min-height:65px;

    padding:15px;

    border:1px solid #dadce0;
    border-radius:7px;

    background:#ffffff;

    color:#188038;

    font-size:14px;
    line-height:1.5;

    word-break:break-word;
}


/* =========================================================
   REVIEW BUTTON
========================================================= */

.review-button{

    display:none;

    width:100%;

    margin-top:14px;

    padding:16px;

    border-radius:7px;

    background:#188038;

    color:#ffffff;

    text-decoration:none;

    text-align:center;

    font-size:17px;

    font-weight:bold;

}


/* =========================================================
   RESET BUTTON
========================================================= */

.reset-button{

    display:none;

    background:#5f6368;

}


/* =========================================================
   NOTE
========================================================= */

.note{

    margin-top:20px;

    padding:13px;

    border-left:4px solid #673ab7;

    background:#f8f5ff;

    color:#555;

    font-size:13px;

    line-height:1.5;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:400px){

    body{
        padding:8px;
    }

    .container{
        border-radius:12px;
    }

    .header h1{
        font-size:22px;
    }

    .content{
        padding:17px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="header">

        <h1>
            3974 - Dawa Dawa
        </h1>

        <p>
            Please scan the QR code to open the service review form.
        </p>

    </div>



    <!-- =====================================================
         CONTENT
    ====================================================== -->

    <div class="content">


        <!-- =================================================
             PRACTICE EMAIL
        ================================================== -->

        <label for="email">
            Practice Email
        </label>


        <select id="email" class="email">

            <option>
                test.customer1@example.com
            </option>

            <option>
                practice.user2@example.com
            </option>

            <option>
                demo.review3@example.com
            </option>

        </select>



        <!-- =================================================
             CAMERA
        ================================================== -->

        <label>
            Scan QR Code
        </label>


        <div class="camera-wrapper">

            <video
                id="video"
                autoplay
                playsinline
                muted>
            </video>


            <div class="scan-frame">

                <div class="corner top-left"></div>

                <div class="corner top-right"></div>

                <div class="corner bottom-left"></div>

                <div class="corner bottom-right"></div>

                <div class="scan-line"></div>

            </div>

        </div>



        <!-- =================================================
             CAMERA BUTTON
        ================================================== -->

        <button
            id="cameraButton"
            onclick="cameraButtonClicked()">

            📷 Open Mobile Camera

        </button>



        <!-- =================================================
             STATUS
        ================================================== -->

        <div
            id="status"
            class="status">

            Camera is currently off.

        </div>



        <!-- =================================================
             RESULT
        ================================================== -->

        <div class="result-title">

            QR Code Result

        </div>


        <div
            id="result"
            class="result">

            No QR code scanned yet.

        </div>



        <!-- =================================================
             OPEN REVIEW
        ================================================== -->

        <a
            id="reviewButton"
            class="review-button"
            href="#"
            target="_blank"
            rel="noopener">

            ⭐ Open Review Form

        </a>



        <!-- =================================================
             RESET
        ================================================== -->

        <button
            id="resetButton"
            class="reset-button"
            onclick="resetScanner()">

            Scan Another QR Code

        </button>



        <!-- =================================================
             NOTE
        ================================================== -->

        <div class="note">

            This scanner is for accessing your genuine review form.
            The example email addresses above are dummy addresses for
            interface testing only.

        </div>


    </div>

</div>



<!-- =========================================================
     jsQR LIBRARY
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>



<script>

/* =========================================================
   YOUR QR CODE
========================================================= */

/*
   This is the URL encoded in the QR image you uploaded.
*/

const YOUR_REVIEW_FORM =
"https://docs.google.com/forms/d/e/1FAIpQLSc4Ip8M5ptHkusM5V5SG3WFwZPkc54D3PKhJVv6X3crafnrFw/viewform?usp=pp_url&entry.1061967502=3974%20-%20Dawa%20Dawa";



/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const cameraButton =
    document.getElementById("cameraButton");

const statusBox =
    document.getElementById("status");

const resultBox =
    document.getElementById("result");

const reviewButton =
    document.getElementById("reviewButton");

const resetButton =
    document.getElementById("resetButton");



/* =========================================================
   VARIABLES
========================================================= */

let stream = null;

let scanning = false;

let animationFrame = null;



/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.createElement("canvas");

const context =
    canvas.getContext(
        "2d",
        {
            willReadFrequently:true
        }
    );



/* =========================================================
   CAMERA BUTTON
========================================================= */

function cameraButtonClicked(){

    if(scanning){

        stopCamera();

    }

    else{

        startCamera();

    }

}



/* =========================================================
   START CAMERA
========================================================= */

async function startCamera(){

    /*
       Check browser support
    */

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        showError(
            "Camera is not supported by this browser."
        );

        return;

    }


    /*
       IMPORTANT:
       Camera normally requires HTTPS.
    */

    if(
        location.protocol !== "https:" &&
        location.hostname !== "localhost" &&
        location.hostname !== "127.0.0.1"
    ){

        showError(
            "Camera requires HTTPS. Open this page from an HTTPS website or suitable local server."
        );

        return;

    }


    statusBox.innerHTML =
        "Requesting camera permission...";

    cameraButton.disabled = true;


    try{

        /*
           Rear camera
        */

        stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }
                },

                audio:false

            });


        /*
           Attach camera
        */

        video.srcObject =
            stream;


        /*
           Start video
        */

        await video.play();


        scanning = true;


        cameraButton.disabled =
            false;


        cameraButton.innerHTML =
            "⛔ Stop Camera";


        cameraButton.classList.add(
            "stop"
        );


        statusBox.innerHTML =
            "📷 Camera is active. Point it at the QR code.";


        /*
           Start QR detection
        */

        scanQRCode();

    }

    catch(error){

        console.log(error);


        cameraButton.disabled =
            false;


        cameraButton.innerHTML =
            "📷 Open Mobile Camera";


        cameraButton.classList.remove(
            "stop"
        );


        if(
            error.name ===
            "NotAllowedError"
        ){

            showError(
                "Camera permission was denied. Please allow camera access in your browser settings."
            );

        }

        else if(
            error.name ===
            "NotFoundError"
        ){

            showError(
                "No camera was found on this phone."
            );

        }

        else if(
            error.name ===
            "NotReadableError"
        ){

            showError(
                "The camera is being used by another application."
            );

        }

        else{

            showError(
                "Camera could not be opened: " +
                error.message
            );

        }

    }

}



/* =========================================================
   SCAN QR CODE
========================================================= */

function scanQRCode(){

    if(!scanning){

        return;

    }


    if(video.readyState >= 2){

        const width =
            video.videoWidth;

        const height =
            video.videoHeight;


        if(
            width > 0 &&
            height > 0
        ){

            /*
               Canvas dimensions
            */

            canvas.width =
                width;

            canvas.height =
                height;


            /*
               Draw video
            */

            context.drawImage(
                video,
                0,
                0,
                width,
                height
            );


            /*
               Read image
            */

            const imageData =
                context.getImageData(
                    0,
                    0,
                    width,
                    height
                );


            /*
               Detect QR
            */

            const code =
                jsQR(
                    imageData.data,
                    imageData.width,
                    imageData.height,
                    {
                        inversionAttempts:
                            "attemptBoth"
                    }
                );


            /*
               QR FOUND
            */

            if(code){

                qrFound(
                    code.data
                );

                return;

            }

        }

    }


    /*
       Continue
    */

    animationFrame =
        requestAnimationFrame(
            scanQRCode
        );

}



/* =========================================================
   QR FOUND
========================================================= */

function qrFound(data){

    scanning = false;


    if(animationFrame){

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;

    }


    /*
       Show actual scanned value
    */

    resultBox.innerText =
        data;


    /*
       Check whether it is YOUR QR
    */

    if(
        data.includes(
            "docs.google.com/forms"
        )
    ){

        statusBox.innerHTML =
            "✅ QR code recognized. Review form is ready.";

        reviewButton.href =
            data;

        reviewButton.style.display =
            "block";

    }

    else{

        statusBox.innerHTML =
            "QR code scanned successfully.";

        /*
           For a different QR code,
           don't automatically redirect.
        */

        reviewButton.style.display =
            "none";

    }


    /*
       Stop camera
    */

    stopCamera(false);


    cameraButton.disabled =
        false;


    cameraButton.innerHTML =
        "📷 Scan Again";


    cameraButton.classList.remove(
        "stop"
    );


    resetButton.style.display =
        "block";

}



/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera(updateStatus = true){

    scanning = false;


    if(animationFrame){

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;

    }


    if(stream){

        stream.getTracks().forEach(
            function(track){

                track.stop();

            }
        );

        stream = null;

    }


    video.srcObject =
        null;


    if(updateStatus){

        statusBox.innerHTML =
            "Camera stopped.";

        cameraButton.disabled =
            false;

        cameraButton.innerHTML =
            "📷 Open Mobile Camera";

        cameraButton.classList.remove(
            "stop"
        );

    }

}



/* =========================================================
   RESET
========================================================= */

function resetScanner(){

    resultBox.innerText =
        "No QR code scanned yet.";


    reviewButton.style.display =
        "none";


    resetButton.style.display =
        "none";


    statusBox.innerHTML =
        "Camera is currently off.";


    cameraButton.innerHTML =
        "📷 Open Mobile Camera";

}



/* =========================================================
   ERROR
========================================================= */

function showError(message){

    statusBox.innerHTML =
        "⚠️ " + message;

    statusBox.style.color =
        "#b3261e";

}



/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(document.hidden){

            if(scanning){

                stopCamera();

            }

        }

    }
);

</script>


</body>

</html>
